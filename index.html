<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Idle Civ — prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="titleRow">
    <div id="titleLeft">
      <span id="titleName">Idle Civ</span>
      <span id="ageBadge">[Stone Age]</span>
      <span id="pauseFlag" class="hidden">— PAUSED —</span>
    </div>
    <div id="titleRight">
      <span id="playClock" title="Time the settlement has actually advanced (frozen while paused)">0m 00s</span>
      <button id="infoBtn" class="link" title="Reference: everything in the game, by era">[ Info ]</button>
      <button id="speedBtn" class="link" title="Run the simulation faster — click to cycle. Everything resolves normally, just sooner.">[ 1× ]</button>
      <button id="pauseBtn" class="link" title="Freeze the simulation (spacebar)">[ Pause ]</button>
      <button id="saveBtn" class="link" title="Progress also saves automatically">[ Save ]</button>
      <button id="resetBtn" class="link" title="Wipe all progress">[ Reset ]</button>
    </div>
  </div>

  <!-- Resource tracker. Rows are generated from the RESOURCES table in game.js
       and revealed the first time you hold that resource (or its era starts). -->
  <div id="resourceBar">
    <span id="emptyStores">— stores are nearly empty —</span>
  </div>

  <!-- 2 rows x 4 columns: roster panels on top, action panels beneath each,
       Chronicle spans both rows in the last column. Roster panels can grow to
       span both rows themselves while their paired action-panel is empty --
       see updateSpans() in game.js. -->
  <div id="mainArea">

    <!-- Row 1 -->
    <section class="block" id="panel-village">
      <h2>Your People</h2>
      <div class="block-body">
        <div id="personTiles" class="holdings-grid"></div>
        <div class="pop-summary">
          <div class="pop-stat"><span class="pop-num" id="popIdle">3</span><span class="pop-lbl">idle</span></div>
          <div class="pop-stat"><span class="pop-num" id="popCap">3</span><span class="pop-lbl">housing</span></div>
        </div>
        <div class="growthline" id="growthLine"></div>
        <div id="jobList" class="job-list"></div>
      </div>
    </section>

    <section class="block hidden" id="panel-holdings">
      <h2>Settlement</h2>
      <div class="block-body">
        <p class="holdings-empty" id="holdingsEmpty">Nothing built yet.</p>
        <div id="holdingsBody" class="holdings-grid hidden"></div>
      </div>
    </section>

    <section class="block hidden" id="panel-queue">
      <h2>Build Queue</h2>
      <div class="block-body">
        <p class="holdings-empty" id="queueEmpty">Nothing queued.</p>
        <div id="queueBody" class="queue-list hidden"></div>
      </div>
    </section>

    <section class="block" id="panel-log">
      <h2>Chronicle</h2>
      <div class="block-body">
        <div id="log" class="log"></div>
      </div>
    </section>

    <!-- Row 2 -->
    <section class="block hidden" id="panel-training">
      <h2>Training</h2>
      <div class="block-body">
        <div id="trainingList" class="build-list"></div>
      </div>
    </section>

    <section class="block hidden" id="panel-build">
      <h2>Construction</h2>
      <div class="block-body">
        <div id="buildingList" class="build-list"></div>
      </div>
    </section>

    <section class="block hidden" id="panel-upgrades">
      <h2>Upgrades</h2>
      <div class="block-body">
        <div id="upgradeList" class="build-list"></div>
      </div>
    </section>

    <!-- Hidden until the era has adversaries AND a Muster Ground stands; the
         Chronicle gives up its double-row span to make room (see updateSpans). -->
    <section class="block hidden" id="panel-expeditions">
      <h2>Expeditions</h2>
      <div class="block-body">
        <div id="expeditionStatus" class="exp-status"></div>
        <div id="adversaryList" class="adv-list"></div>
      </div>
    </section>

  </div>

  <!-- Single-at-a-time modal. Dismiss by X, by clicking the dim overlay, or Esc.
       No dragging / resizing / minimizing by design -- see tech.md. -->
  <div id="modalOverlay" class="hidden">
    <section class="block" id="modalPanel">
      <h2 id="modalHead">
        <span id="modalTitle"></span>
        <button id="modalClose" class="modal-x" title="Close">×</button>
      </h2>
      <div class="block-body" id="modalBody"></div>
      <div id="modalActions" class="modal-actions hidden"></div>
    </section>
  </div>

  <script src="game.js"></script>
</body>
</html>
