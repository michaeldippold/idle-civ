<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Idle Civ — prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Bureau's three registers: Grotesk for UI, Mono for every number, Newsreader
       for Chronicle prose and modal leads. See redesign/DESIGN-NOTES.md. -->
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-era="stone">

  <div id="titleRow">
    <div id="titleLeft">
      <span id="titleName">Idle Civ</span>
      <!-- Era badge: a filled plate with a material dot rather than bracketed
           text. It's the main marker of progress, so it gets weight. The bone
           ring keeps it off the desk on dark (later-era) backgrounds. -->
      <span id="ageBadge"><span class="badge-dot"></span><span id="ageBadgeText">Stone Age</span></span>
      <span id="pauseFlag" class="hidden">Paused</span>
    </div>
    <div id="titleRight">
      <span id="playClock" title="World time actually simulated, and the raw tick count — frozen while paused or hidden. The tick is the coordinate a bug report wants.">0m 00s</span>
      <!-- Transport controls: pause is how you think, speed is how you get on
           with it. Grouped as one instrument, borders one weight up from the
           utility verbs (weight, never opacity), Reset pushed off to the far
           edge. See interface.md, The header. -->
      <span id="transport">
        <button id="pauseBtn" class="chrome-btn transport" title="Freeze the world and think (Space)">Pause</button>
        <button id="speedBtn" class="chrome-btn transport" title="How fast the world runs — click to cycle, keys 1–5 to set. Everything resolves normally, just sooner.">1×</button>
      </span>
      <button id="mapBtn" class="chrome-btn hidden" title="The known world — your holdings and your neighbours">Map</button>
      <button id="infoBtn" class="chrome-btn" title="Reference: everything in the game, by era">Info</button>
      <button id="saveBtn" class="chrome-btn" title="Progress also saves automatically, and on every action">Save</button>
      <button id="resetBtn" class="chrome-btn danger" title="Wipe all progress">Reset</button>
    </div>
  </div>

  <!-- Resource ledger. Rows are generated from the RESOURCES table in game.js
       and revealed the first time you hold that resource (or its era starts).
       Population leads the strip: it has a value, a cap and a rate, so it is a
       resource, and the red at-cap value says "housing is full" without a
       sentence having to. -->
  <div id="resourceBar">
    <span id="emptyStores">— stores are nearly empty —</span>
  </div>

  <!-- 2 rows x 4 columns: roster panels on top, action panels beneath each,
       Chronicle spans both rows in the last column until Expeditions takes its
       lower half (see updateSpans() in game.js).
       Every panel the current era can fill is present from frame one, empty
       and waiting. What unravels is their CONTENTS, not the board itself --
       see design.md, "Unravel the contents, not the board". -->
  <div id="mainArea">

    <!-- Row 1 -->
    <section class="block" id="panel-village">
      <h2>Your People</h2>
      <!-- Cork, not paper: this column is about people rather than paperwork.
           Everything on it is an opaque box, so it reads as cards on a pinboard. -->
      <div class="block-body ruled-cork">
        <div id="personTiles" class="holdings-grid"></div>
        <div class="growthline" id="growthLine"></div>
        <div id="jobList" class="job-list"></div>
      </div>
    </section>

    <section class="block" id="panel-holdings">
      <h2>Settlement</h2>
      <div class="block-body ruled-graph">
        <p class="holdings-empty" id="holdingsEmpty">Nothing built yet.</p>
        <div id="holdingsBody" class="holdings-grid hidden"></div>
      </div>
    </section>

    <section class="block" id="panel-queue">
      <h2>Build Queue</h2>
      <div class="block-body ruled-dot">
        <p class="holdings-empty" id="queueEmpty">Nothing queued.</p>
        <div id="queueBody" class="queue-list hidden"></div>
      </div>
    </section>

    <section class="block" id="panel-log">
      <h2>Chronicle</h2>
      <!-- The one panel where the material is allowed to be the point: a legal
           pad, ruled at 28px with a red margin rule. Entries sit on the rules. -->
      <div class="block-body legal-pad">
        <div id="log" class="log"></div>
      </div>
    </section>

    <!-- Row 2 -->
    <section class="block" id="panel-training">
      <h2>Training</h2>
      <div class="block-body ruled-cork">
        <p class="holdings-empty hidden" id="trainingEmpty">Nothing to train yet.</p>
        <div id="trainingList" class="build-list"></div>
      </div>
    </section>

    <section class="block" id="panel-build">
      <h2>Construction</h2>
      <div class="block-body ruled-graph">
        <p class="holdings-empty hidden" id="buildEmpty">Nothing to build yet.</p>
        <div id="buildingList" class="build-list"></div>
      </div>
    </section>

    <section class="block" id="panel-upgrades">
      <h2>Upgrades</h2>
      <div class="block-body ruled-dot">
        <!-- Owned upgrades are filtered out rather than dimmed in place: faded
             text read as "you can't have this", which is the opposite of true. -->
        <p class="holdings-empty hidden" id="upgradesUnknown">Nothing to learn yet.</p>
        <div class="tabs hidden" id="upgradeTabs">
          <button class="tab active" id="tabAvailable">Available</button>
          <button class="tab" id="tabOwned">Owned</button>
        </div>
        <p class="holdings-empty hidden" id="upgradesEmpty">Nothing owned yet.</p>
        <div id="upgradeList" class="build-list"></div>
      </div>
    </section>

    <!-- Present in any era whose manifest declares adversaries -- i.e. once the
         world has an outside at all. The Muster Ground gates the ACTIONS, not
         the panel. The Chronicle gives up its double-row span to make room
         (see updateSpans). -->
    <section class="block hidden" id="panel-expeditions">
      <h2>Expeditions</h2>
      <div class="block-body ruled-dot">
        <div id="expeditionStatus" class="exp-status"></div>
        <div id="adversaryList" class="adv-list"></div>
      </div>
    </section>

  </div>

  <!-- Descriptions live here and nowhere else. Inline descriptions clog the
       board once eight panels are open; hover means they can be MORE verbose,
       not less. The tooltip also carries the refusal reason ("Short 24 wood."),
       so there is one place to look when something won't buy. -->
  <div id="tooltip" class="hidden">
    <div id="tipTitle"></div>
    <div id="tipBody"></div>
    <div id="tipWhy" class="hidden"></div>
  </div>

  <!-- Single-at-a-time modal. Dismiss by X, by clicking the dim overlay, or Esc.
       No dragging / resizing / minimizing by design -- see tech.md. -->
  <div id="modalOverlay" class="hidden">
    <section class="block" id="modalPanel">
      <h2 id="modalHead">
        <span id="modalTitle"></span>
        <button id="modalClose" class="modal-x" title="Close">×</button>
      </h2>
      <div class="block-body" id="modalBody"></div>
      <div id="modalActions" class="modal-actions hidden"></div>
    </section>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
