<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Idle Civ — prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="titleRow">
    <div id="titleLeft">
      <span id="titleName">Idle Civ</span>
      <span id="ageBadge">[Stone Age]</span>
    </div>
    <div id="titleRight">
      <button id="saveBtn" class="link" title="Progress also saves automatically">[ Save ]</button>
      <button id="resetBtn" class="link" title="Wipe all progress">[ Reset ]</button>
    </div>
  </div>

  <!-- Resource tracker. Rows reveal the first time you produce that resource. -->
  <div id="resourceBar">
    <span id="emptyStores">— stores are nearly empty —</span>
    <div class="res hidden" id="res-food">
      <span class="res-name">Food</span>
      <span class="res-val" id="val-food">0</span>
      <span class="res-rate" id="rate-food"></span>
    </div>
    <div class="res hidden" id="res-wood">
      <span class="res-name">Wood</span>
      <span class="res-val" id="val-wood">0</span>
      <span class="res-rate" id="rate-wood"></span>
    </div>
    <div class="res hidden" id="res-stone">
      <span class="res-name">Stone</span>
      <span class="res-val" id="val-stone">0</span>
      <span class="res-rate" id="rate-stone"></span>
    </div>
  </div>

  <!-- 2 rows x 4 columns: roster panels on top, action panels beneath each,
       Chronicle spans both rows in the last column. Roster panels can grow to
       span both rows themselves while their paired action-panel is empty --
       see updateSpans() in game.js. -->
  <div id="mainArea">

    <!-- Row 1 -->
    <section class="block" id="panel-village">
      <h2>Your People</h2>
      <div class="block-body">
        <div id="personTiles" class="holdings-grid"></div>
        <div class="pop-summary">
          <div class="pop-stat"><span class="pop-num" id="popIdle">3</span><span class="pop-lbl">idle</span></div>
          <div class="pop-stat"><span class="pop-num" id="popCap">3</span><span class="pop-lbl">housing</span></div>
        </div>
        <div class="growthline" id="growthLine"></div>
        <div id="jobList" class="job-list"></div>
      </div>
    </section>

    <section class="block hidden" id="panel-holdings">
      <h2>Settlement</h2>
      <div class="block-body">
        <p class="holdings-empty" id="holdingsEmpty">Nothing built yet.</p>
        <div id="holdingsBody" class="holdings-grid hidden"></div>
      </div>
    </section>

    <section class="block hidden" id="panel-queue">
      <h2>Build Queue</h2>
      <div class="block-body">
        <p class="holdings-empty" id="queueEmpty">Nothing queued.</p>
        <div id="queueBody" class="queue-list hidden"></div>
      </div>
    </section>

    <section class="block" id="panel-log">
      <h2>Chronicle</h2>
      <div class="block-body">
        <div id="log" class="log"></div>
      </div>
    </section>

    <!-- Row 2 -->
    <section class="block hidden" id="panel-training">
      <h2>Training</h2>
      <div class="block-body">
        <div id="trainingList" class="build-list"></div>
      </div>
    </section>

    <section class="block hidden" id="panel-build">
      <h2>Construction</h2>
      <div class="block-body">
        <div id="buildingList" class="build-list"></div>
      </div>
    </section>

    <section class="block hidden" id="panel-upgrades">
      <h2>Upgrades</h2>
      <div class="block-body">
        <div id="upgradeList" class="build-list"></div>
      </div>
    </section>

  </div>

  <script src="game.js"></script>
</body>
</html>
