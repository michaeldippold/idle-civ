<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Idle Civ — 3D map spike</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      font: 12px/1.5 system-ui, sans-serif; color: #cfd8e3;
      background: rgba(12, 16, 22, 0.62); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; padding: 8px 12px; pointer-events: none;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    #hud .k { color: #8a94a3; }
    #hud .hint { margin-top: 4px; color: #7d8794; font-size: 11px; }
    #err {
      position: fixed; bottom: 12px; left: 12px; right: 12px; z-index: 11;
      font: 12px/1.4 ui-monospace, monospace; color: #ffb0b0; white-space: pre-wrap;
      display: none; background: rgba(40,10,10,0.8); border-radius: 8px; padding: 8px 12px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "postprocessing": "https://unpkg.com/postprocessing@6.35.3/build/index.js",
      "n8ao": "https://unpkg.com/n8ao@2.0.1/dist/N8AO.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"><canvas id="gl"></canvas></div>
  <div id="hud">
    <div><span class="k">seed</span> <span id="hud-seed">…</span>
         &nbsp;<span class="k">tiles</span> <span id="hud-tiles">…</span>
         &nbsp;<span class="k">fps</span> <span id="hud-fps">…</span></div>
    <div><span class="k">ao</span> <span id="hud-ao">…</span></div>
    <div class="hint">drag: orbit &middot; wheel: zoom &middot; right-drag/shift: pan &middot; click: log tile</div>
  </div>
  <div id="err"></div>
  <script>
    window.addEventListener("error", (e) => {
      const el = document.getElementById("err");
      el.style.display = "block";
      el.textContent += (e.message || e.error) + "\n";
    });
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
